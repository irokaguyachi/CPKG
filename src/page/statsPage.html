<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>방문자 통계</title>
<link rel="icon" type="image/png" href="../offline_src/favicon.png" />
<script>
  (function () {
    var s = localStorage.getItem('chokaguya_theme');
    var d = s || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', d);
  })();
</script>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --border: #e2e5ea;
    --text: #1c1d22;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-soft: rgba(37, 99, 235, 0.12);
    --good: #0f9d58;
    --bar: #3b82f6;
    --bar-track: #eceef2;
  }
  :root[data-theme="dark"] {
    --bg: #121316;
    --panel: #1c1d22;
    --border: rgba(255, 255, 255, 0.1);
    --text: #f1f3f5;
    --muted: rgba(255, 255, 255, 0.55);
    --accent: #5c9aff;
    --accent-soft: rgba(92, 154, 255, 0.16);
    --good: #6ee7a8;
    --bar: #5c9aff;
    --bar-track: rgba(255, 255, 255, 0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
      "Segoe UI", Roboto, "Helvetica Neue", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 32px 20px 64px; }
  .page-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  h1 { font-size: 1.4rem; margin: 0; letter-spacing: -0.01em; }
  .page-sub { color: var(--muted); font-size: 0.85rem; margin: 0 0 24px; }
  .refreshed { color: var(--muted); font-size: 0.78rem; }

  /* 토큰 입력 */
  .gate { max-width: 380px; margin: 12vh auto 0; text-align: center; }
  .gate h1 { margin-bottom: 6px; }
  .gate p { color: var(--muted); font-size: 0.85rem; margin: 0 0 20px; }
  .gate form { display: flex; gap: 8px; }
  .gate input {
    flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 0.9rem;
  }
  .gate button, .btn {
    padding: 10px 16px; border-radius: 8px; border: 1px solid transparent;
    background: var(--accent); color: #fff; font-size: 0.85rem; font-weight: 600;
    cursor: pointer;
  }
  .btn.ghost { background: transparent; border-color: var(--border); color: var(--text); font-weight: 500; }
  .gate .err { color: #dc2626; font-size: 0.8rem; margin-top: 12px; min-height: 1em; }
  :root[data-theme="dark"] .gate .err { color: #fca5ac; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .tile { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .tile .label { color: var(--muted); font-size: 0.78rem; margin-bottom: 8px; }
  .tile .value { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .tile .value .unit { font-size: 0.9rem; font-weight: 500; color: var(--muted); margin-left: 3px; }
  .tile .meta { color: var(--muted); font-size: 0.74rem; margin-top: 6px; min-height: 1em; }
  .tile.live .value { color: var(--good); }
  .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 6px; vertical-align: middle; animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 20px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .card-head h2 { font-size: 0.95rem; margin: 0; }
  .card-head .range-btns { display: flex; gap: 6px; }
  .range-btns button {
    padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-size: 0.78rem; cursor: pointer;
  }
  .range-btns button.on { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

  .chart { width: 100%; overflow-x: auto; }
  .chart svg { display: block; width: 100%; height: 220px; min-width: 480px; }
  .chart .grid-line { stroke: var(--border); stroke-width: 1; }
  .chart .bar { fill: var(--bar); }
  .chart .bar:hover { fill: var(--accent); }
  .chart .axis-label { fill: var(--muted); font-size: 10px; }

  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  th, td { text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; }
  tbody tr:hover { background: var(--accent-soft); }

  .msg { color: var(--muted); font-size: 0.85rem; padding: 20px 0; text-align: center; }
  .hint { color: var(--muted); font-size: 0.76rem; line-height: 1.6; }
  code { background: var(--bar-track); padding: 1px 5px; border-radius: 4px; font-size: 0.9em; }
</style>
</head>
<body>

<div id="gate" class="gate" hidden>
  <h1>방문자 통계</h1>
  <p>관리자 토큰을 입력하면 통계를 볼 수 있습니다.</p>
  <form id="gate-form">
    <input id="gate-input" type="password" autocomplete="off" placeholder="STATS_ADMIN_TOKEN" />
    <button type="submit">확인</button>
  </form>
  <div class="err" id="gate-err"></div>
</div>

<div id="app" class="wrap" hidden>
  <div class="page-head">
    <h1>방문자 통계</h1>
    <div>
      <span class="refreshed" id="refreshed"></span>
      <button class="btn ghost" id="btn-logout" type="button">토큰 지우기</button>
    </div>
  </div>
  <p class="page-sub">실시간 동시 접속자는 브라우저 하트비트로, 순 방문자는 Analytics Engine 기록으로 집계합니다.</p>

  <div class="tiles" id="tiles"></div>

  <div class="card">
    <div class="card-head">
      <h2>일별 순 방문자</h2>
      <div class="range-btns" id="range-btns">
        <button data-days="7" type="button">7일</button>
        <button data-days="30" type="button" class="on">30일</button>
        <button data-days="90" type="button">90일</button>
      </div>
    </div>
    <div class="chart" id="chart"></div>
    <div class="msg" id="chart-msg" hidden></div>
  </div>

  <div class="card">
    <div class="card-head"><h2>일별 상세</h2></div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>날짜(KST)</th><th>순 방문자</th><th>페이지뷰</th></tr></thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>

  <p class="hint" id="hint"></p>
</div>

<script defer src="../js/statsPage.js"></script>
</body>
</html>
