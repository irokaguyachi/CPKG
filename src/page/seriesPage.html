<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title></title>
<link rel="preload" href="../fonts/Pretendard-1.3.9/web/variable/woff2/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="../css/common.css" />
<link rel="stylesheet" href="../css/theme.css" />
<script>
  (function () {
    var s = localStorage.getItem('chokaguya_theme');
    var d = s || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', d);
  })();
</script>
</head>
<body>

<div class="loader" id="loader" role="status" aria-live="polite">
  <div class="loader-wipe is-covering" id="loader-wipe"></div>
  <div class="loader-content" id="loader-content">
    <div class="loader-center">
      <div class="loader-icon" id="loader-icon"></div>
      <span class="loader-loading-text">Loading</span>
    </div>
    <p class="loader-tip"><span class="loader-tip-tag">TIP</span> | <span id="loader-tip-text"></span><span class="loader-caret" aria-hidden="true"></span></p>
  </div>
</div>

<header class="header">
  <a class="header-logo-link" href="mainPage.html" aria-label="메인 페이지로 이동">
    <img class="header-logo" src="../assets/Image/Logo_Series_Dark.png" data-light-src="../assets/Image/Logo_Series_Dark.png" data-dark-src="../assets/Image/Logo_Series_Light.png" alt="시리즈 문학" />
  </a>
</header>

<button type="button" class="sidebar-toggle-btn" aria-label="메뉴 열기">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
</button>

<aside class="sidebar">
  <nav class="header-nav">
    <a href="OfficialPage.html">공식</a>
    <a href="#" data-locked>번역</a>
    <a href="novelPage.html">문학</a>
    <a href="seriesPage.html" class="header-nav-strong">시리즈</a>
    <a href="HOFPage.html">명예관</a>
    <a href="bookmarksPage.html">북마크</a>
  </nav>
</aside>

<section class="site-info">
  <h1 class="site-info-title">시리즈 문학</h1>
  <p class="site-info-sub">연재중인 시리즈들을 한눈에 모아봤어요</p>
  <p class="site-info-stat" id="series-count">0개의 시리즈가 있습니다!</p>
</section>

<div class="series-toolbar">
  <div class="series-toolbar-row">
    <label class="series-search">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5.5" stroke="#000000" stroke-width="1.5"/><line x1="11.5" y1="11.5" x2="15" y2="15" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input type="text" id="series-search-input" placeholder="시리즈 이름으로 검색" autocomplete="off" />
    </label>
    <div class="series-filter">
      <button type="button" class="series-filter-btn" id="series-filter-btn" aria-haspopup="true" aria-expanded="false" aria-label="태그 필터">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M2.5 3.5H17.5L11.5 10.3V16L8.5 14.3V10.3L2.5 3.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </button>
      <div class="series-filter-panel" id="series-filter-panel">
        <div class="sfp-header">
          <span>원하는 태그를 고르세요!</span>
        </div>
        <div class="sfp-options" id="series-filter-options"></div>
      </div>
    </div>
  </div>
</div>

<section class="series-grid" id="series-grid"></section>

<footer class="site-footer">
  <p class="site-footer-line">해당 페이지는 <strong>절대로</strong> 초! 카구야 공주의 공식이 아니며, 팬메이드 페이지임을 알립니다.</p>

</footer>
