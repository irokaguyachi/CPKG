<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>오디오 노벨</title>
<link rel="icon" type="image/png" href="../offline_src/favicon.png" />
<link rel="manifest" href="../manifest.webmanifest" />
<meta name="theme-color" content="#ffffff" />
<link rel="stylesheet" href="../fonts/Pretendard-dynamic/pretendardvariable-dynamic-subset.css" />
<link rel="stylesheet" href="../css/base/fonts.css" />
<link rel="stylesheet" href="../css/base/reset.css" />
<link rel="stylesheet" href="../css/base/colorTheme.css" />
<link rel="stylesheet" href="../css/layout/header.css" />
<link rel="stylesheet" href="../css/layout/sidebar.css" />
<link rel="stylesheet" href="../css/components/loader.css" />
<link rel="stylesheet" href="../css/components/audio-novel-player.css" />
<link rel="stylesheet" href="../css/pages/audio-novel-reader.css" />
<link rel="stylesheet" href="../css/theme.css" />
<script>
  (function () {
    var s = localStorage.getItem('chokaguya_theme');
    var d = s || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', d);
  })();
</script>
</head>
<body>

<div class="loader" id="loader" role="status" aria-live="polite">
  <div class="loader-wipe is-covering" id="loader-wipe"></div>
  <div class="loader-content" id="loader-content">
    <div class="loader-center">
      <div class="loader-icon" id="loader-icon"></div>
      <span class="loader-loading-text">Loading</span>
    </div>
  </div>
</div>

<header class="header">
  <a class="header-logo-link" href="/" aria-label="메인 페이지로 이동">
    <img class="header-logo" src="../offline_src/logo/Logo_Official_Dark.png" data-light-src="../offline_src/logo/Logo_Official_Dark.png" data-dark-src="../offline_src/logo/Logo_Official_Light.png" alt="공식" />
  </a>
  <span class="an-header-title" id="an-header-title"></span>
</header>

<button type="button" class="sidebar-toggle-btn" aria-label="메뉴 열기">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
</button>

<aside class="sidebar">
  <nav class="header-nav">
    <div class="header-nav-primary">
      <a href="/" class="header-nav-main">메인</a>
      <a href="/notice" class="header-nav-changelog">공지사항</a>
    </div>
    <a href="/official" class="header-nav-strong">공식</a>
    <a href="#" data-locked>번역</a>
    <a href="/novel">문학</a>
    <a href="/series">시리즈</a>
    <a href="/hof">명예관</a>
    <a href="/bookmarks">북마크</a>
  </nav>
</aside>

<div class="hero-space" data-hero-space></div>

<p class="an-source-link">
  원문(디시인사이드) 보기: <a id="an-source-link-a" href="#" target="_blank" rel="noopener noreferrer"></a>
</p>

<article class="an-content" id="an-content"></article>

<div class="an-player" id="an-player">
  <p class="an-player-label" id="an-player-label"></p>
  <div class="an-player-bar">
    <button type="button" class="an-player-btn an-player-play" id="an-player-play" aria-label="재생/일시정지">
      <svg class="an-icon-play" viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M2 1.5L8.5 5L2 8.5V1.5Z" fill="currentColor"/></svg>
      <svg class="an-icon-pause" viewBox="0 0 10 10" fill="none" aria-hidden="true"><rect x="2" y="1.5" width="2" height="7" fill="currentColor"/><rect x="6" y="1.5" width="2" height="7" fill="currentColor"/></svg>
    </button>
    <div class="an-player-slider" id="an-player-slider">
      <div class="an-player-slider-out">
        <div class="an-player-slider-in" id="an-player-slider-in"></div>
      </div>
    </div>
    <span class="an-player-time" id="an-player-time">0:00 / 0:00</span>
    <button type="button" class="an-player-btn an-player-mute" id="an-player-mute" aria-label="음소거">
      <svg class="an-icon-mute-on" viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M1 3.5H3L5.5 1.5V8.5L3 6.5H1V3.5Z" fill="currentColor"/><path d="M7 3.2C7.6 3.8 7.6 6.2 7 6.8" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/></svg>
      <svg class="an-icon-mute-off" viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M1 3.5H3L5.5 1.5V8.5L3 6.5H1V3.5Z" fill="currentColor"/><path d="M7 3.2L9 6.8M9 3.2L7 6.8" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/></svg>
    </button>
  </div>
</div>

<script defer src="../js/cdnConfig.js"></script>
<script defer src="../js/theme.js"></script>
<script defer src="../js/sidebar.js"></script>
<script defer src="../js/loading.js"></script>
<script defer src="../js/audioNovelReader.js"></script>
<script>
  // ?chapter=1 / ?chapter=2 로 화를 고른다 (없으면 1장). 화가 늘어나면
  // 이 표에 항목만 추가하면 된다.
  var AN_CHAPTERS = {
    '1': {
      file: '1장.md',
      title: '초! 카구야 공주 공식 소설 1장',
      dcId: 749,
      dcLabel: '초 카구야 공주! 서장~1장'
    },
    '2': {
      file: '2장.md',
      title: '초! 카구야 공주 공식 소설 2장',
      dcId: 750,
      dcLabel: '초 카구야 공주! 2장'
    }
  };

  window.addEventListener('DOMContentLoaded', function () {
    var chapterParam = new URLSearchParams(location.search).get('chapter') || '1';
    var chapter = AN_CHAPTERS[chapterParam] || AN_CHAPTERS['1'];

    document.title = '오디오 노벨 — ' + chapter.title.slice(chapter.title.length - 2);
    document.getElementById('an-header-title').textContent = '- ' + chapter.title;

    var link = document.getElementById('an-source-link-a');
    link.href = 'https://gall.dcinside.com/mgallery/board/view/?id=singles&no=' + chapter.dcId;
    link.textContent = chapter.dcLabel;

    // src/AudioNovel 전체가 이제 R2 CDN(sync_to_r2.py)에 올라가 있으므로,
    // 로컬 상대경로 대신 그 주소를 그대로 쓴다 (cdnConfig.js 의 R2_CDN_BASE).
    var AN_CDN_BASE = window.R2_CDN_BASE + '/AudioNovel';

    AudioNovelReader.init({
      containerId: 'an-content',
      sourceUrl: AN_CDN_BASE + '/NovelData/Official/' + chapter.file,
      audioDataUrl: AN_CDN_BASE + '/asset/sound/Music/Official/Novel/AudioData.json',
      soundBase: AN_CDN_BASE + '/asset/sound/Music/Official/Novel/',
      imgBase: AN_CDN_BASE + '/asset/img/'
    });
  });
</script>
</body>
</html>
