name = "cpkg"
main = "_worker.js"
compatibility_date = "2026-08-20"

# ckpg.cloud에서 cpkg.cloud로 이전 중 — _worker.js가 ckpg.cloud 요청을
# cpkg.cloud로 301 리다이렉트하므로, 이 라우트는 두 도메인 다 이 Worker에
# 붙어 있어야 정상 동작한다(ckpg.cloud는 대시보드에 이미 연결돼 있음).
[[routes]]
pattern = "cpkg.cloud"
custom_domain = true

# 정적 사이트 자산 — 이 디렉터리(src/) 자체가 사이트 루트다.
# _worker.js 가 처리하지 않는 모든 요청은 여기로 떨어진다.
# html_handling 기본값(auto-trailing-slash)은 .html 확장자 URL을
# 확장자 없는 주소로 307 리다이렉트해버린다 — 이 사이트는 모든 링크와
# window.location.replace 호출이 .html을 그대로 쓰고 있으므로, 리다이렉트
# 없이 요청한 경로 그대로 응답하도록 반드시 "none"으로 꺼야 한다.
[assets]
directory = "."
binding = "ASSETS"
html_handling = "none"

# 사이드바의 버전 표시(auth.js .auth-version-tag)를 누르면 실제 배포 시각을
# 보여준다 — 커밋을 손으로 추적하는 대신, Cloudflare가 지금 실행 중인 Worker
# Version에 직접 붙여 주는 값(id/tag/timestamp)을 그대로 쓴다. _worker.js의
# /__build-info 라우트가 이 값을 클라이언트에 JSON으로 내려준다.
[version_metadata]
binding = "CF_VERSION_METADATA"

# 아래 두 바인딩은 원래 별도 Worker였던 chokaguya-favorites-share
# (worker/wrangler.toml, 이제 삭제됨)에 있던 것과 완전히 동일한 리소스를
# 그대로 재사용한다 — 데이터가 있는 R2/KV는 그대로 두고 Worker만 이쪽으로
# 옮겼다.
[[r2_buckets]]
binding = "FAVORITES_BUCKET"
bucket_name = "chokaguya-assets"

# RATE_LIMIT_KV 는 이제 회원가입 일당 창(하루 5회/IP) 하나에만 쓰인다.
# 나머지 레이트리밋은 아래 [[ratelimits]] 네이티브 바인딩이 담당한다 —
# 지우면 회원가입 한도가 사라지므로 그대로 둔다.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "564a89b518d544eeabec62fb758d17ed"

# ---- 유저 태그 투표 D1 ----
# 태그 투표(post_id, tag_name, voter_hash)를 담는다 — 스키마는
# worker/tags_schema.sql. `wrangler d1 create cpkg-tags`로 만든 실제
# 데이터베이스(리전 APAC)다. 원격 배포 전에 한 번
#   wrangler d1 execute cpkg-tags --remote --file=../worker/tags_schema.sql
# 로 스키마를 적용해야 한다(로컬 검증은 --local로).
[[d1_databases]]
binding = "TAGS_DB"
database_name = "cpkg-tags"
database_id = "ef95b6f7-38e6-4408-8783-0f6d89a077b3"

# ---- 네이티브 Rate Limiting 바인딩 ----
# KV 카운터(get→비교→put)를 대체한다. 원자적이고 KV 할당량을 전혀 쓰지 않아서
# "레이트리밋이 API 전체의 단일 장애점"이던 구조가 없어진다.
#
# ⚠️ period 는 10 또는 60(초)만 허용된다. 예전의 시간당 창을 그대로 옮길 수
#    없어서 전부 60초 창으로 다시 잡았다 — 장시간 누적 상한은 사라지지만
#    실제 위협인 폭주는 더 확실히 막힌다. 3600 같은 값을 넣으면 배포가 실패한다.
# namespace_id 는 이 Worker 안에서만 유효한 식별자라 임의의 숫자면 되고,
# 서로 겹치지만 않으면 된다(1001~1005 로 잡았다).

[[ratelimits]]
name = "RL_LIB_WRITE"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "RL_LIB_LIST"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "RL_OWNER_LOOKUP"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "RL_USER_AUTH"
namespace_id = "1004"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "RL_USER_SYNC"
namespace_id = "1005"
  [ratelimits.simple]
  limit = 20
  period = 60

# 생일 배너의 팬케이크 카운터(/pancake/add) — 클라이언트가 5초 idle마다
# 배치로 한 번만 부르므로(src/js/pancakeCounter.js) 넉넉히 잡아도 된다.
[[ratelimits]]
name = "RL_PANCAKE"
namespace_id = "1006"
  [ratelimits.simple]
  limit = 20
  period = 60

# 유저 태그 투표(/tags/vote). 조회(/tags/get, /tags/snapshot)는 읽기 전용이라
# 레이트리밋을 안 건다 — GET /library/<code>와 같은 방침.
[[ratelimits]]
name = "RL_TAG_WRITE"
namespace_id = "1007"
  [ratelimits.simple]
  limit = 20
  period = 60

# ---- 방문자 통계 ----
# 목표는 Cloudflare 커스텀 대시보드(Traffic overview)에서 이 수치를 차트로
# 보는 것이다. 커스텀 대시보드는 GraphQL API 데이터셋만 그리는데, Analytics
# Engine 데이터셋도 GraphQL로 조회되므로("Cloudflare 대시보드를 돌리는 그
# API") 후보가 된다. 두 데이터셋으로 나눈 이유는 방문 이벤트와 접속자 게이지가
# 스키마도 조회 방식도 달라서, 한 데이터셋에 섞으면 차트마다 판별용 필터를
# 걸어야 하기 때문이다.
#
# 1) 순 방문자·페이지뷰. _worker.js의 recordPageView가 문서 요청마다
#    writeDataPoint를 한 줄씩 남긴다. dataset 이름을 바꾸면 statsApi.js의
#    AE_DATASET 상수도 같이 바꿔야 한다.
[[analytics_engine_datasets]]
binding = "VISITS_AE"
dataset = "cpkg_visits"

# 2) 동시 접속자 게이지. 아래 [triggers] Cron이 1분마다 Durable Object에서
#    현재 접속자 수를 읽어 이 데이터셋에 한 줄씩 적재한다 → 시계열 차트로
#    "동시 접속자 추이"를, 하루치 MAX로 "피크"를 그릴 수 있다.
[[analytics_engine_datasets]]
binding = "PRESENCE_AE"
dataset = "cpkg_presence"

# 3) 실시간 동시 접속자 수와 피크는 Durable Object 하나(이름 "global")가
#    들고 있다. new_sqlite_classes 로 올려서 무료 요금제에서도 동작한다.
#    class_name 은 _worker.js가 export 하는 클래스 이름과 정확히 같아야 한다.
[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "PresenceDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PresenceDO"]

# 1분마다 scheduled 핸들러(_worker.js)를 깨워 접속자 게이지를 PRESENCE_AE에
# 적재한다. 사이트에 아무도 없어도 online=0 한 줄이 남아 그래프가 끊기지 않는다.
[triggers]
crons = ["* * * * *"]

# Analytics Engine SQL API 호출에 쓰는 계정 ID. 시크릿이 아니라 vars 로 둔다.
# 조회용 토큰(CF_ANALYTICS_TOKEN, Account Analytics: Read)과 통계 페이지
# 접근 토큰(STATS_ADMIN_TOKEN)은 `wrangler secret put` 으로 따로 넣는다.
[vars]
CF_ACCOUNT_ID = "494ceae5bf9fdce6201060393a5a1d30"
