<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>초카구야공주 문학 아카이브</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <div class="hero-eyebrow">chokaguyahime · dcinside</div>
    <h1>초카구야공주 문학 아카이브</h1>
    <p class="sub">달빛 아래 쌓인 문학들 — 크롤링·명예관·대회·시리즈를 한곳에 모았습니다.</p>
    <div class="hero-stats">
      <div class="hero-stat"><div class="num" id="stat-posts">0</div><div class="label">전체 문학</div></div>
      <div class="hero-stat"><div class="num" id="stat-series">0</div><div class="label">연재 시리즈</div></div>
      <div class="hero-stat"><div class="num" id="stat-chapters">0</div><div class="label">시리즈 회차</div></div>
    </div>
  </div>
</div>

<div class="shell">
  <div class="tabs" role="tablist">
    <button class="tab-btn" role="tab" aria-selected="true" id="tab-posts-btn">전체 문학</button>
    <button class="tab-btn" role="tab" aria-selected="false" id="tab-series-btn">시리즈</button>
  </div>

  <section class="panel active" id="panel-posts">
    <div class="controls">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search-input" placeholder="제목으로 검색…" />
      </div>
      <select id="page-size">
        <option value="50">50개씩</option>
        <option value="100" selected>100개씩</option>
        <option value="200">200개씩</option>
      </select>
    </div>
    <div class="tagbar" id="tagbar"></div>
    <div class="count-line" id="count-line"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-sort="i" style="width:5.5rem">ID<span class="arrow"></span></th>
            <th data-sort="t">제목<span class="arrow"></span></th>
            <th data-sort="g">태그<span class="arrow"></span></th>
            <th data-sort="c" style="width:6rem">글자수<span class="arrow"></span></th>
          </tr>
        </thead>
        <tbody id="post-rows"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </section>

  <section class="panel" id="panel-series">
    <div class="controls">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="series-search" placeholder="시리즈명으로 검색…" />
      </div>
    </div>
    <div class="count-line" id="series-count-line"></div>
    <div class="series-grid" id="series-grid"></div>
  </section>
</div>

<footer>초 카구야 공주 갤러리 문학 아카이브 · 비공식 팬 정리 자료</footer>

<script src="script.js"></script>
</body>
</html>
