name = "chokaguya-favorites-share"
main = "favoritesShareWorker.js"
compatibility_date = "2026-08-20"

# 북마크 라이브러리 데이터를 이미지와 같은 R2 버킷의 library/ 프리픽스 아래에 저장합니다.
# bucket_name은 로컬 .r2_config.json의 bucket_name 값과 동일해야 합니다
# (src/scripts/sync_to_r2.py가 이미지 업로드에 쓰는 것과 같은 버킷).
[[r2_buckets]]
binding = "FAVORITES_BUCKET"
bucket_name = "chokaguya-assets"

# 북마크 라이브러리(/library) 쓰기·목록 조회의 IP당 요청 횟수 제한에 씁니다.
# 2026-08-21 생성 완료 (npx wrangler kv namespace create RATE_LIMIT_KV).
# 바인딩이 없으면 Worker 는 레이트리밋을 건너뛴 채 동작하므로(fail open,
# favoritesShareWorker.js 의 checkRateLimit 참고) 이 id 를 비우지 마세요.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "564a89b518d544eeabec62fb758d17ed"

# 배포 절차:
#   cd worker
#   wrangler login
#   wrangler deploy
# 배포가 끝나면 출력되는 workers.dev 주소를
# src/js/bookmarkLibrary.js 의 WORKER_BASE 에 넣어주세요
# (name 이 그대로면 주소가 안 바뀌므로 손댈 필요 없습니다).
